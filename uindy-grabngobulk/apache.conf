<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName uindybulkordering.up.railway.app

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /simplesaml /var/simplesamlphp/public

    <Directory /var/simplesamlphp/public>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>