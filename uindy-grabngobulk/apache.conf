<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName uindybulkordering.up.railway.app

    # Railway terminates SSL at its proxy — the container only ever receives
    # traffic that was HTTPS at the edge. Force HTTPS=on unconditionally so
    # SimpleSAMLphp (including its ACS handler) always sees a secure connection
    # and can set session.cookie.secure cookies correctly.
    SetEnv HTTPS on
    SetEnv SERVER_PORT 443
    RequestHeader set X-Forwarded-Proto "https"

    php_flag display_errors on
    php_value error_reporting 32767

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /simplesaml /var/simplesamlphp/public

    <Directory /var/simplesamlphp/public>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>