<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName uindybulkordering.up.railway.app
 
    # Railway terminates SSL at its proxy and forwards traffic as HTTP internally.
    # This tells PHP/SimpleSAMLphp that the connection is actually HTTPS,
    # allowing secure cookies to work correctly.
    SetEnvIf X-Forwarded-Proto https HTTPS=on
    SetEnvIf X-Forwarded-Proto https SERVER_PORT=443
    RequestHeader set X-Forwarded-Proto "https"
 
    php_flag display_errors on
    php_value error_reporting 32767
 
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
 
    Alias /simplesaml /var/simplesamlphp/public
 
    <Directory /var/simplesamlphp/public>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>